nelmio_api_doc:
    documentation:
        info:
            title: My App
            description: This is an awesome app!
            version: 1.0.0
        components:
            schemas:
                ExceptionResponse:
                    type: object
                    properties:
                        type:
                            type: string
                        title:
                            type: string
                        status:
                            type: number
                        detail:
                            type: string

                ValidationExceptionResponse:
                    type: object
                    properties:
                        type:
                            type: string
                        title:
                            type: string
                        status:
                            type: number
                        detail:
                            type: string
                        violations:
                            type: array
                            items:
                                type: object
                                properties:
                                    propertyPath:
                                        type: string
                                        example: property
                                    title:
                                        type: string
                                        example: Wrong property.
                                    template:
                                        type: string
                                        example: template
                                    parameters:
                                        type: object
                                        example: {"{{ key }}": "value"}

    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
