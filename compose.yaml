
services:
  nginx:
    build: ./docker/nginx
    ports:
      - ${NGINX_PORT:-80}:80
    volumes:
      - .:/var/www/html:rw
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - .:/var/www/html:rw
    environment:
      XDEBUG_MODE: develop,debug
      XDEBUG_CONFIG: client_host=host.docker.internal
    depends_on:
      mariadb:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway

###> doctrine/doctrine-bundle ###
  mariadb:
    image: mariadb:13.0.2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tileexpert}
      MARIADB_USER: ${MARIADB_USER:-user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 1s
      retries: 5
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mariadbql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  mariadb_data:
###< doctrine/doctrine-bundle ###
